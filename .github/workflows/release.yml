name: Release

# On a version tag (v1.2.3), tests and builds as deploy.yml does, then attaches
# the package to a GitHub release as md-display.tgz, for
#   npx -y https://github.com/railsagainstignorance/md-display/releases/latest/download/md-display.tgz
# Nothing goes to the npm registry.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Check the tag matches package.json
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json version $version"
            exit 1
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build
      # A fixed name, so releases/latest/download/md-display.tgz always works;
      # the versioned copy is for anyone who wants to pin one.
      - name: Pack
        run: |
          npm pack
          cp "md-display-${GITHUB_REF_NAME#v}.tgz" md-display.tgz
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'md-display*.tgz'
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" md-display.tgz "md-display-${GITHUB_REF_NAME#v}.tgz" --generate-notes
